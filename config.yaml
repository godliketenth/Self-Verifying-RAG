# ============================================================================
# Self-Verifying Agentic RAG - single source of truth for every setting.
# Nothing in src/ hardcodes a value that belongs here. Change it here, rerun.
# ============================================================================

seed: 42                      # fixed everywhere, so every run is reproducible

# --- LLM settings ---------------------------------------------------------
# The project supports several providers. Switch with `provider:` below, or
# at the command line with `--provider gemini`. Each entry is a complete
# recipe: endpoint, which env var holds the key, which models to use, and
# what they cost. Nothing else in the code knows which provider is active.
llm:
  provider: "gemini"          # gemini | openrouter

  providers:
    gemini:
      # Google ships an OpenAI-COMPATIBLE endpoint, so the same `openai`
      # client works against it - only the base_url and model names change.
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
      api_key_env: "GEMINI_API_KEY"
      generator_model: "gemini-2.5-flash"
      helper_model: "gemini-2.5-flash-lite"
      # Free tier costs nothing, so USD figures are 0 and the honest cost
      # metric becomes tokens and call counts - which the report already
      # treats as primary for exactly this reason.
      pricing:
        "gemini-2.5-flash":      {input: 0.0, output: 0.0}
        "gemini-2.5-flash-lite": {input: 0.0, output: 0.0}

    openrouter:
      base_url: "https://openrouter.ai/api/v1"
      api_key_env: "OPENROUTER_API_KEY"
      generator_model: "anthropic/claude-sonnet-5"
      helper_model: "anthropic/claude-haiku-4.5"
      pricing:
        "anthropic/claude-sonnet-5":  {input: 2.0, output: 10.0}
        "anthropic/claude-haiku-4.5": {input: 1.0, output: 5.0}

  temperature: 0.0            # deterministic: same prompt -> same answer
  max_tokens: 1024
  timeout_s: 120
  max_retries: 5
  # Client-side throttle, set to the tightest free-tier limit of the active
  # provider. Gemini free tier allows ~10-15 requests/minute.
  requests_per_minute: 10
  # Abort the whole run after this many consecutive failed questions. Without
  # it, a quota problem silently produces empty results that LOOK like data.
  abort_after_consecutive_errors: 5

# --- Retrieval -------------------------------------------------------------
retrieval:
  embedding_model: "BAAI/bge-small-en-v1.5"
  embedding_dim: 384
  # bge models are trained with this instruction prefix on QUERIES only.
  query_prefix: "Represent this sentence for searching relevant passages: "
  top_k: 5                    # passages handed to the generator
  claim_top_k: 3              # passages retrieved per claim during verification
  candidates_per_retriever: 20  # how deep dense/BM25 go before fusion
  rrf_k: 60                   # Reciprocal Rank Fusion constant (standard value)

# --- Data construction -----------------------------------------------------
data:
  hotpot_dataset: "hotpotqa/hotpot_qa"
  hotpot_config: "distractor"
  hotpot_split: "validation"
  n_eval_questions: 100       # questions actually evaluated
  n_corpus_questions: 1000    # questions whose paragraphs form the search index
  ragtruth_dataset: "wandb/RAGTruth-processed"
  # Only 18% of RAGTruth's QA rows contain any hallucination span, so a random
  # sample would give too few positives to measure precision/recall on. We
  # therefore sample a deliberately ENRICHED set: equal numbers of
  # hallucinated and clean responses. Reported precision is conditional on
  # this base rate, which ANALYSIS.md states explicitly.
  n_ragtruth_hallucinated: 25
  n_ragtruth_clean: 25
  span_overlap_threshold: 0.5 # gold span must sit >=50% inside a claim sentence

# --- Pipeline behaviour ----------------------------------------------------
pipeline:
  max_subqueries: 3           # retrieval planner hop cap (scope limit: 2-3 hops)
  max_claims: 8               # cap per answer, keeps cost bounded
  claim_dedup_threshold: 0.95 # cosine similarity above which claims are dupes
  relevance_threshold: 0.5    # below this a passage is dropped (CRAG-style)
  min_relevant_passages: 2    # fewer than this triggers one retrieval re-plan
  max_replan_rounds: 1
  max_correction_rounds: 1

# --- Paths -----------------------------------------------------------------
paths:
  data_dir: "data"
  index_dir: "data/index"
  runs_dir: "runs"
  cache_dir: ".cache/llm"
